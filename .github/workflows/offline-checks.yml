name: Offline logic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-checks.txt
      - run: python -m pip install -r requirements-checks.txt
      - run: python scripts/check.py
      - run: python scripts/check_intel_snapshot.py
